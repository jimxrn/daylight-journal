<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daylight • Calendar</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="../assets/css/cards.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

    <!-- Calendar CSS -->
    <link rel="stylesheet" href="../assets/css/calendar.css">

</head>

<body>

<div class="navigation">

    <div class="logo">

        <div class="logo-icon">☀️</div>

        <h2>Daylight</h2>

        <span>your personal space</span>

    </div>

    <nav>

        <button class="nav-item"
            onclick="location.href='../index.html'">

            Dashboard

        </button>

        <button class="nav-item">

            Journal

        </button>

        <button class="nav-item active">

            Calendar

        </button>

        <button class="nav-item">

            Planner

        </button>

        <button class="nav-item">

            Habits

        </button>

        <button class="nav-item">

            Memories

        </button>

        <button class="nav-item">

            Settings

        </button>

    </nav>

</div>

<main class="calendar-page">

    <div class="calendar-layout">

        <!-- LEFT -->
        <section class="calendar-container">

            <div class="calendar-header">

                <button id="prevMonth">←</button>

                <h1 id="monthYear"></h1>

                <button id="nextMonth">→</button>

            </div>

            <div class="weekdays">

                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>

            </div>

            <div
                id="calendarGrid"
                class="calendar-grid">

            </div>

        </section>

        <!-- RIGHT -->

        <aside class="event-sidebar">

            <div class="sidebar-header">

                <h2 id="selectedDate">

                    Today

                </h2>

                <p id="selectedFullDate">

                    Saturday, August 1, 2026

                </p>

            </div>

            <div class="event-list">

                <p class="empty-events">

                    No events yet.

                </p>

            </div>

            <button id="addEventBtn">

                + Add Event

            </button>

        </aside>

    </div>

</main>

<!-- ==========================================
     ADD EVENT MODAL
========================================== -->

<div id="eventModal" class="modal hidden">

    <div class="modal-card">

        <h2 id="modalTitle">Add Event</h2>

        <div class="form-group">

            <label>Title</label>

            <input
                type="text"
                id="eventTitle"
                placeholder="Dinner with family">

        </div>

        <div class="form-group">

            <label>Time</label>

            <input
                type="time"
                id="eventTime">

        </div>

        <div class="form-group">

            <label>Category</label>

            <select id="eventCategory">

                <option>Personal</option>
                <option>Work</option>
                <option>Birthday</option>
                <option>Reminder</option>

            </select>

        </div>

        <div class="form-group">

            <label>Notes</label>

            <textarea
                id="eventNotes"
                rows="4"
                placeholder="Optional">

            </textarea>

        </div>

        <div class="modal-actions">

            <button id="cancelEvent">

                Cancel

            </button>

            <button id="saveEvent">

                <span id="saveEventText">

                Save Event

                </span>

            </button>

        </div>

    </div>

</div>

<script src="../assets/js/birthdays.js"></script>
<script src="../assets/js/calendar.js"></script>

</body>

</html>
