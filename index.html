<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daylight</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/navigation.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/widgets.css">
    

</head>

<body>

<div class="navigation">

    <div class="logo">

        <div class="logo-icon">
            ☀️
        </div>

        <h2>Daylight</h2>

        <span>your personal space</span>

    </div>

    <nav>

        <button class="nav-item active">Dashboard</button>

        <button class="nav-item">Journal</button>

        <button class="nav-item">Calendar</button>

        <button class="nav-item">Planner</button>

        <button class="nav-item">Habits</button>

        <button class="nav-item">Memories</button>

        <button class="nav-item">Settings</button>

    </nav>

</div>

<main class="dashboard">

    <header class="hero">

        <p id="today"></p>

        <h1 id="greeting"></h1>

        <p class="quote">

            Every day is another chance to begin.

        </p>

    </header>

    <section class="dashboard-grid">

       <div class="card widget small">

        <div class="widget-header">

            <div class="widget-title">

                <div class="widget-icon">
                😊
            </div>

            <div>

                <h3>Today's Mood</h3>

                <p class="widget-subtitle">
                    Today
                </p>

            </div>

        </div>

    </div>

    <div class="widget-body">

        <p class="widget-text">

            How are you feeling today?

        </p>

        <div class="mood-picker">

            <button class="mood-btn">😄</button>
            <button class="mood-btn">😊</button>
            <button class="mood-btn">😌</button>
            <button class="mood-btn">😐</button>
            <button class="mood-btn">😔</button>
            <button class="mood-btn">😭</button>

        </div>

    </div>

        <div class="widget-footer">

            <div class="mood-status">

                <span class="mood-label">

            Ready whenever you are.

        </span>

        <span class="mood-time">

            No check-in today

        </span>

    </div>

</div>

</section>

</main>

<!-- Core Scripts -->
<script src="assets/js/storage.js"></script>
<script src="assets/js/greeting.js"></script>
<script src="assets/js/dashboard.js"></script>

<!-- Widget Scripts -->
<script src="assets/js/widgets/mood.js"></script>
<script src="assets/js/widgets/journal.js"></script>
<script src="assets/js/widgets/calendar.js"></script>
<script src="assets/js/widgets/planner.js"></script>
<script src="assets/js/widgets/habits.js"></script>
<script src="assets/js/widgets/memories.js"></script>

<!-- Application Entry -->
<script src="assets/js/app.js"></script>

</body>

</html>
