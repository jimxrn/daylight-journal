<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memories • Daylight</title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
>
    


    <!-- Shared Daylight CSS -->

    <link
        rel="stylesheet"
        href="../../assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/base.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/navigation.css"
    >

    <link
    rel="stylesheet"
    href="../../assets/css/brand%20identity/brand.css"
    >


    <!-- Memories -->

    <link
        rel="stylesheet"
        href="memories.css"
    >

</head>


<body data-page="memories">


    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <div id="daylight-brand">

        <div class="logo">

            <div class="logo-icon">
                ☀️
            </div>

            <h2>
                Daylight
            </h2>

            <span>
                your personal space
            </span>

        </div>


        <nav>

            <button
                class="nav-item"
                onclick="location.href='../dashboard/dashboard.html'"
            >
                Dashboard
            </button>


            <button
                class="nav-item"
                onclick="location.href='../journal/journal.html'"
            >
                Journal
            </button>


            <button
                class="nav-item"
                onclick="location.href='../calendar/calendar.html'"
            >
                Calendar
            </button>


            <button
                class="nav-item"
                onclick="location.href='../planner/planner.html'"
            >
                Planner
            </button>


            <button
                class="nav-item"
                onclick="location.href='../habits/habits.html'"
            >
                Habits
            </button>


            <button
                class="nav-item active"
            >
                Memories
            </button>


            <button
                class="nav-item"
            >
                Settings
            </button>

        </nav>

    </div>



    <!-- ==========================================
         MEMORIES
    =========================================== -->

    <main class="memories-page">


        <!-- HEADER -->

        <header class="memories-header">

            <div class="memory-botanical memory-botanical-left" aria-hidden="true">
                <svg viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">

                    <path d="M40 112 C40 82 39 54 30 20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.2"
                        stroke-linecap="round"/>

                    <path d="M31 40 C19 35 13 27 11 18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.1"
                        stroke-linecap="round"/>

                    <path d="M35 56 C48 50 55 42 57 33"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.1"
                        stroke-linecap="round"/>

                    <path d="M39 72 C26 67 20 60 18 52"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.1"
                        stroke-linecap="round"/>

                     <path d="M40 88 C52 83 59 76 61 68"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.1"
                        stroke-linecap="round"/>


                </svg>

            </div>


            <div>

                <p class="memories-eyebrow">
                    YOUR MOMENTS
                </p>

                <h1>
                    Memories
                </h1>

                <p class="memories-subtitle">
                    What mattered today?
                </p>

            </div>
            
            <div class="memory-sun" aria-hidden="true">

               <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <circle
                        cx="20"
                        cy="20"
                        r="7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1"
                    />

                    <g
                        stroke="currentColor"
                        stroke-width="1"
                        stroke-linecap="round"
                    >
                        <path d="M20 3 V8"/>
                        <path d="M20 32 V37"/>
                        <path d="M3 20 H8"/>
                        <path d="M32 20 H37"/>
                        <path d="M8 8 L12 12"/>
                        <path d="M28 28 L32 32"/>
                        <path d="M32 8 L28 12"/>
                        <path d="M12 28 L8 32"/>
                    </g>

                </svg>

            </div>

            <button
                id="add-memory-button"
                class="memory-add-button"
                type="button"
            >
                +
            </button>

        </header>



        <!-- MAIN LAYOUT -->

        <section class="memories-layout">


            <!-- ==================================
                 CALENDAR
            =================================== -->

            <div class="memories-calendar-card">


                <div class="calendar-heading">

                    <button
                        id="previous-month"
                        class="month-button"
                        type="button"
                        aria-label="Previous month"
                    >
                        ‹
                    </button>


                   <div class="memory-month-title">

                        <h2 id="memory-month">
                            August 2026
                        </h2>

                         <p id="memory-month-subtitle">
                            a collection of little moments
                        </p>

                    </div>


                    <button
                        id="next-month"
                        class="month-button"
                        type="button"
                        aria-label="Next month"
                    >
                        ›
                    </button>

                </div>



                <div class="weekday-row">

                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>

                </div>



                <div
                    id="memory-calendar"
                    class="memory-calendar"
                >
                </div>



                <div class="memories-message">

                     <div class="message-botanical">
                        ❧
                    </div>

                   <p id="memory-month-message">
                        August, in little moments.
                    </p>

                    <span id="memory-month-count">
                        A little something worth keeping.
                    </span>

                    <div class="message-heart">
                        ♡
                    </div>

                </div>

            </div>



            <!-- ==================================
                 DETAIL / ADD PANEL
            =================================== -->

            <aside
                id="memory-detail"
                class="memory-detail"
            >

                <!-- Content injected by JS -->

            </aside>


        </section>


    </main>



  <!-- ==========================================
     MEMORY SCRIPT
========================================== -->

<script src="../../assets/js/storage.js"></script>

<script src="memories.js"></script>

<script src="../../assets/css/brand%20identity/brand.js"></script>

</body>
</html>
