<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daylight • Journal</title>


    <!-- ==========================================
         GOOGLE FONTS
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         SHARED CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../../assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/base.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/cards.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/responsive.css"
    >


    <!-- ==========================================
         JOURNAL CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="journal.css"
    >

</head>


<body>


    <!-- ==========================================
         NAVIGATION
    ========================================== -->

    <div class="navigation">

        <div class="logo">

            <div class="logo-icon">
                🌅
            </div>

            <h2>Daylight</h2>

            <span>
                your personal space
            </span>

        </div>


        <nav>

            <button
                class="nav-item"
                onclick="location.href='../../index.html'"
            >
                Dashboard
            </button>


            <button class="nav-item active">
                Journal
            </button>


            <button
                class="nav-item"
                onclick="location.href='../calendar/calendar.html'"
            >
                Calendar
            </button>


            <button
                class="nav-item"
                onclick="location.href='../planner/planner.html'"
            >
                Planner
            </button>


            <button class="nav-item">
                Habits
            </button>


            <button class="nav-item">
                Memories
            </button>


            <button class="nav-item">
                Settings
            </button>

        </nav>

    </div>


    <!-- ==========================================
         JOURNAL PAGE
    ========================================== -->

    <main class="journal-page">

        <div class="journal-layout">


            <!-- ======================================
                 MAIN JOURNAL
            ======================================= -->

            <div class="journal-main">


                <!-- HEADER -->

                <header class="journal-header">

                    <p class="journal-eyebrow">
                        JOURNAL
                    </p>

                    <h1>
                        A quiet place<br>
                        for your thoughts.
                    </h1>

                    <p class="journal-intro">
                        Take a moment. Write freely.
                        Nothing needs to be perfect.
                    </p>

                </header>


                <!-- ==================================
                     JOURNAL PROMPT
                =================================== -->

                <section class="journal-section">

                    <div class="section-heading">
                        JOURNAL PROMPTS
                    </div>


                    <div class="prompt-card">

                        <div class="prompt-text-wrap">

                            <p
                                id="journal-prompt"
                                class="journal-prompt"
                            >
                                “What made today feel a little lighter?”
                            </p>

                        </div>


                        <div class="prompt-response">

                            <textarea
                                id="prompt-response"
                                placeholder="Write your response..."
                                spellcheck="true"
                            ></textarea>

                        </div>


                        <div class="prompt-footer">

                            <span class="prompt-sun">
                                ☀
                            </span>


                            <div class="prompt-actions">

                                <button
                                    type="button"
                                    id="new-prompt"
                                    class="new-prompt-btn"
                                >
                                    New prompt →
                                </button>

                                <button
                                    type="button"
                                    id="save-prompt"
                                    class="save-prompt-btn"
                                >
                                    Save Response ♡
                                </button>

                            </div>

                        </div>

                    </div>

                </section>


                <!-- ==================================
                     THOUGHTS TODAY / SELECTED DATE
                =================================== -->

                <section class="journal-section thoughts-section">

                    <div class="section-heading-row">

                        <div class="section-heading">
                            <span id="thoughts-label">
                                THOUGHTS TODAY
                            </span>
                        </div>


                        <button
                            id="back-to-today"
                            class="back-today-btn hidden"
                        >
                            ← Back to Today
                        </button>

                    </div>


                    <div class="journal-editor">

                        <textarea
                            id="journal-entry"
                            placeholder="What's on your mind?"
                            spellcheck="true"
                        ></textarea>


                        <div class="editor-footer">

                            <div class="journal-meta">

                                <span id="word-count">
                                    0 words
                                </span>

                                <span class="meta-divider">
                                    •
                                </span>

                                <span id="last-edited">
                                    Not saved yet
                                </span>

                            </div>


                            <button
                                type="button"
                                id="save-journal"
                                class="save-entry-btn"
                            >
                                Save Entry <span>♡</span>
                            </button>

                        </div>

                    </div>

                </section>

            </div>


            <!-- ======================================
                 JOURNAL HISTORY
            ======================================= -->

            <aside class="journal-history">

                <div class="history-card">


                    <!-- HISTORY HEADER -->

                    <div class="history-header">

                        <div>

                            <p class="history-eyebrow">
                                JOURNAL HISTORY
                            </p>

                            <h2 id="history-month">
                                August 2026
                            </h2>

                        </div>


                        <div class="history-navigation">

                            <button
                                id="prev-journal-month"
                                aria-label="Previous month"
                            >
                                ←
                            </button>

                            <button
                                id="next-journal-month"
                                aria-label="Next month"
                            >
                                →
                            </button>

                        </div>

                    </div>


                    <!-- MINI CALENDAR -->

                    <div class="mini-calendar">

                        <div class="mini-weekdays">

                            <span>S</span>
                            <span>M</span>
                            <span>T</span>
                            <span>W</span>
                            <span>T</span>
                            <span>F</span>
                            <span>S</span>

                        </div>


                        <div
                            id="journal-calendar-grid"
                            class="journal-calendar-grid"
                        ></div>

                    </div>


                    <!-- LEGEND -->

                    <div class="history-legend">

                        <span class="legend-dot"></span>

                        <span>
                            Journal entry
                        </span>

                    </div>


                    <!-- TODAY BUTTON -->

                    <button
                        id="journal-today-btn"
                        class="journal-today-btn"
                    >
                        Today
                    </button>

                </div>

            </aside>

        </div>

    </main>


    <!-- ==========================================
         JOURNAL JS
    ========================================== -->

    <script src="journal.js"></script>


</body>

</html>
