<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Planner • Daylight</title>

    <!-- GOOGLE FONT -->
     
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="../assets/css/cards.css">
    <link rel="stylesheet" href="../assets/css/widgets.css">
    <link rel="stylesheet" href="../assets/css/planner.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

</head>

<body>

    <div class="app-container">

            <!-- ======================================
            SIDEBAR / NAVIGATION
            ======================================= -->

                <!-- Reuse your existing navigation here -->

<main class="planner-page">

    <!-- ======================================
         PAGE HEADER
    ======================================= -->

    <section class="planner-header">

        <div class="planner-greeting">

            <div>
                <p class="greeting-label">
                    Good morning ☀️
                </p>

                <h1>
                    Ready to make today count?
                </h1>

                <p class="planner-tagline">
                    Small plans today become big wins tomorrow.
                </p>
               
            </div>   
            <div class="planner-date-card">

                        📅
                <span id="todayFullDate"></span>

            </div>

        </div>  

    </section>

    <!-- ======================================
         PLANNER LAYOUT
    ======================================= -->

    <div class="planner-layout">

        <!-- ======================================
             LEFT PANEL
        ======================================= -->

        <aside class="planner-sidebar">

             <div class="daylight-brand">
                
                <div class="brand-icon">🌅</div>

                <h2>Daylight</h2>

                <p>
                    Plan with purpose.<br>
                    Live with intention.
                </p>    
           </div>

           <hr class="brand-divider">

            <!-- ALL PLANS -->

            <section class="planner-card">

                <div class="planner-group-header">

                    <h2>📖 Plans </h2>

                </div>

                <div
                    id="allPlans"
                    class="plan-list">


                </div>

                <!-- NEW PLAN -->

                <button id="newPlanBtn">

                    + New Plan

                </button>

            </section>


             <!-- Motivation -->

            <section class="planner-card motivation-card">

                <p>☀️ </p>

                <p>
                     Planning today<br>
                     is a gift<br>
                     to your future self.
                </p>

            </section>

        </aside>


        <!-- ======================================
            NEW PLAN MODAL
        ====================================== -->

        <div
            id="planModal"
            class="modal hidden">

            <div class="modal-content">

                <h2>New Plan</h2>

                <div class="form-group">

                    <label>Plan Title</label>

                     <input
                    type="text"
                    id="planTitle"
                    placeholder="Website Launch">

                </div>

                <div class="form-group">

                     <label>Date</label>

                    <input
                        type="date"
                        id="planDate">

                </div>

                <div class="modal-actions">

                    <button
                        id="cancelPlan">

                        Cancel

                    </button>

                    <button
                        id="savePlan">

                        Create Plan

                    </button>

                </div>
            </div>
        </div>

        <!-- ======================================
             RIGHT PANEL
        ======================================= -->

        <section class="planner-workspace">

            <div id="planWorkspace"></div>

        </section>

    </div>

</main>

</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/planner.js"></script>

</body>

</html>
