<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daylight • Habits</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet"/>
<!-- Shared Daylight CSS -->
<link href="../../assets/css/variables.css" rel="stylesheet"/>
<link href="../../assets/css/base.css" rel="stylesheet"/>
<link href="../../assets/css/layout.css" rel="stylesheet"/>
<link href="../../assets/css/navigation.css" rel="stylesheet"/>
<link href="../../assets/css/cards.css" rel="stylesheet"/>
<link href="../../assets/css/responsive.css" rel="stylesheet"/>
<!-- Habits CSS -->
<link href="habits.css" rel="stylesheet"/>
<link href="../../assets/css/brand%20identity/brand.css" rel="stylesheet"/>
</head>
<body data-page="habits">
<!-- ==========================================
         NAVIGATION
    ========================================== -->
<div id="daylight-brand"></div>
<!-- ==========================================
         HABITS
    ========================================== -->
<main class="habits-page">
<div class="habits-container">
<!-- HEADER -->
<header class="habits-header">
<div>
<p class="habits-eyebrow">
                        DAILY PRACTICE
                    </p>
<h1>
                        Habits
                    </h1>
<p class="habits-subtitle">
                        Small things, done consistently.
                    </p>
</div>
<button class="today-button" id="todayButton">
                    Today
                </button>
</header>
<!-- TODAY -->
<section class="habits-section">
<div class="section-header">
<div>
<p class="section-label">
                            TODAY
                        </p>
<h2 id="todayDate">
                            Today
                        </h2>
</div>
</div>
<!-- HABIT LIST -->
<div class="habit-list" id="habitList">
<!-- JavaScript will render habits here -->
</div>
</section>
<!-- PROGRESS -->
<section class="progress-card">
<div class="progress-circle">
<span id="progressNumber">
                        0%
                    </span>
</div>
<div class="progress-content">
<p class="section-label">
                        TODAY'S PROGRESS
                    </p>
<h3 id="progressText">
                        0 of 0 completed
                    </h3>
<p id="progressMessage">
                        Start with one small thing.
                    </p>
</div>
</section>
<!-- ADD HABIT -->
<div class="habit-actions">
<button id="addHabitButton" type="button">
                    + Add a habit
                </button>
<button class="manage-habits-button" id="manageHabitsButton" type="button">
                    Manage habits
                </button>
</div>
<!-- RHYTHM -->
<section class="rhythm-section">
<div class="section-header">
<div>
<p class="section-label">
                            YOUR RHYTHM
                        </p>
<h2>
                            A little consistency goes a long way.
                        </h2>
</div>
<button class="view-all-button" id="viewAllButton">
                        View all
                    </button>
</div>
<div class="rhythm-card" id="rhythmCard">
<!-- JavaScript will render rhythm -->
</div>
</section>
</div>
</main>
<!-- ==========================================
         ADD HABIT MODAL
    ========================================== -->
<div class="habit-modal hidden" id="habitModal">
<div class="modal-overlay" id="modalOverlay">
</div>
<div class="habit-modal-content">
<button class="modal-close" id="closeHabitModal">
                ×
            </button>
<p class="section-label" id="habitModalLabel">
                NEW HABIT
            </p>
<h2 id="habitModalTitle">
                 Add something worth practicing.
            </h2>
<p class="modal-description">
                Keep it simple. Choose something you
                want to return to.
            </p>
<label for="habitName">
                Habit name
            </label>
<input id="habitName" placeholder="e.g. Drink water" type="text"/>
<label for="habitIcon">
                Icon
            </label>
<select id="habitIcon">
<option value="💧">
                    💧 Water
                </option>
<option value="📖">
                    📖 Reading
                </option>
<option value="🚶">
                    🚶 Movement
                </option>
<option value="✎">
                    ✎ Journal
                </option>
<option value="🌿">
                    🌿 Wellness
                </option>
<option value="☀️">
                    ☀️ Morning
                </option>
<option value="♡">
                    ♡ Personal
                </option>
</select>
<label for="habitFrequency">
                 Frequency
            </label>
<select id="habitFrequency">
<option value="daily">
                    Every day
                </option>
<option value="weekdays">
                    Weekdays
                </option>
<option value="weekends">
                    Weekends
                </option>
</select>
<div class="modal-actions">
<button class="cancel-button" id="cancelHabit">
                    Cancel
                </button>
<button class="save-button" id="saveHabit">
                    Add habit
                </button>
</div>
</div>
</div>
<!-- Habits JavaScript -->
<script src="habits.js"></script>
<script src="../../assets/css/brand%20identity/brand.js"></script>
</body>
</html>
