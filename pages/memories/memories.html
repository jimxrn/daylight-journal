<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memories • Daylight</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=DM+Sans:wght@400;500;600&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet"/>
<!-- Shared Daylight CSS -->
<link href="../../assets/css/variables.css" rel="stylesheet"/>
<link href="../../assets/css/base.css" rel="stylesheet"/>
<link href="../../assets/css/layout.css" rel="stylesheet"/>
<link href="../../assets/css/navigation.css" rel="stylesheet"/>
<link href="../../assets/css/brand%20identity/brand.css" rel="stylesheet"/>
<!-- Memories -->
<link href="memories.css" rel="stylesheet"/>
</head>
<body data-page="memories">
<!-- ==========================================
         NAVIGATION
    =========================================== -->
<div id="daylight-brand"></div>
<!-- ==========================================
         MEMORIES
    =========================================== -->
<main class="memories-page">
<!-- HEADER -->
<header class="memories-header">
<div aria-hidden="true" class="memory-botanical memory-botanical-left">
<svg viewbox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
<path d="M40 112 C40 82 39 54 30 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"></path>
<path d="M31 40 C19 35 13 27 11 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"></path>
<path d="M35 56 C48 50 55 42 57 33" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"></path>
<path d="M39 72 C26 67 20 60 18 52" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"></path>
<path d="M40 88 C52 83 59 76 61 68" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"></path>
</svg>
</div>
<div>
<p class="memories-eyebrow">
                    YOUR MOMENTS
                </p>
<h1>
                    Memories
                </h1>
<p class="memories-subtitle">
                    What mattered today?
                </p>
</div>
<div aria-hidden="true" class="memory-sun">
<svg viewbox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" fill="none" r="7" stroke="currentColor" stroke-width="1"></circle>
<g stroke="currentColor" stroke-linecap="round" stroke-width="1">
<path d="M20 3 V8"></path>
<path d="M20 32 V37"></path>
<path d="M3 20 H8"></path>
<path d="M32 20 H37"></path>
<path d="M8 8 L12 12"></path>
<path d="M28 28 L32 32"></path>
<path d="M32 8 L28 12"></path>
<path d="M12 28 L8 32"></path>
</g>
</svg>
</div>
</header>
<!-- MAIN LAYOUT -->
<section class="memories-layout">
<!-- ==================================
                 CALENDAR
            =================================== -->
<div class="memories-calendar-card">
<div class="calendar-heading">
<button aria-label="Previous month" class="month-button" id="previous-month" type="button">
                        ‹
                    </button>
<div class="memory-month-title">
<h2 id="memory-month">
                            August 2026
                        </h2>
<p id="memory-month-subtitle">
                            a collection of little moments
                        </p>
</div>
<button aria-label="Next month" class="month-button" id="next-month" type="button">
                        ›
                    </button>
</div>
<div class="weekday-row">
<span>Sun</span>
<span>Mon</span>
<span>Tue</span>
<span>Wed</span>
<span>Thu</span>
<span>Fri</span>
<span>Sat</span>
</div>
<div class="memory-calendar" id="memory-calendar">
</div>
<div class="memories-message">
<div class="message-botanical">
                        ❧
                    </div>
<p id="memory-month-message">
                        August, in little moments.
                    </p>
<span id="memory-month-count">
                        A little something worth keeping.
                    </span>
<div class="message-heart">
                        ♡
                    </div>
</div>
</div>
<!-- ==================================
                 DETAIL / ADD PANEL
            =================================== -->
<aside class="memory-detail" id="memory-detail">
<!-- Content injected by JS -->
</aside>
</section>
</main>
<!-- ==========================================
     MEMORY SCRIPT
========================================== -->
<script src="../../assets/js/storage.js"></script>
<script src="memories.js"></script>
<script src="../../assets/css/brand%20identity/brand.js"></script>
</body>
</html>
