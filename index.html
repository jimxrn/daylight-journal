<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daylight</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">☀️</div>

            <div>

                <h2>Daylight</h2>

                <span>Your Personal Space</span>

            </div>

        </div>

        <nav>

            <button class="nav-item active">🏠 Dashboard</button>

            <button class="nav-item">📝 Journal</button>

            <button class="nav-item">📅 Calendar</button>

            <button class="nav-item">✅ Planner</button>

            <button class="nav-item">🌱 Habits</button>

            <button class="nav-item">📷 Memories</button>

            <button class="nav-item">⚙️ Settings</button>

        </nav>

    </aside>

    <main class="dashboard">

        <header class="hero">

            <p id="today"></p>

            <h1 id="greeting"></h1>

            <p class="quote">

                "Every day is another chance to begin."

            </p>

        </header>

        <section class="dashboard-grid">

            <div class="card small">

                <h3>😊 Mood</h3>

                <p>Feeling Calm</p>

            </div>

            <div class="card large">

                <h3>📝 Journal</h3>

                <p>Continue writing today's reflection...</p>

            </div>

            <div class="card medium">

                <h3>📅 Calendar</h3>

                <p>No upcoming events.</p>

            </div>

            <div class="card medium">

                <h3>🌱 Habits</h3>

                <p>3 of 5 completed today.</p>

            </div>

            <div class="card medium">

                <h3>📷 Memories</h3>

                <p>No photos today.</p>

            </div>

            <div class="card large">

                <h3>🎂 Upcoming</h3>

                <p>No upcoming birthdays or events.</p>

            </div>

        </section>

    </main>

</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/greeting.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/app.js"></script>

</body>

</html>
